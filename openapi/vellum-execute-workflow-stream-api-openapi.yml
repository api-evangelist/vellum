openapi: 3.2.0
info:
  title: Client SDK Execute Workflow Stream API
  version: 1.0.0
servers:
- url: https://predict.vellum.ai
- url: https://api.vellum.ai
- url: https://documents.vellum.ai
tags:
- name: Execute Workflow Stream
paths:
  /v1/execute-workflow-stream:
    post:
      operationId: execute-workflow-stream
      summary: Execute Workflow Stream
      description: Executes a deployed Workflow and streams back its results.
      tags:
      - Execute Workflow Stream
      parameters:
      - name: X-API-KEY
        in: header
        required: true
        schema:
          type: string
      - name: X-API-Version
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/WorkflowStreamEvent'
        '400':
          description: ''
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  description: Any type
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecuteWorkflowStreamErrorResponse'
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecuteWorkflowStreamErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteWorkflowStreamRequest'
components:
  schemas:
    CodeExecutionNodeJsonResult:
      type: object
      properties:
        id:
          type: string
        type:
          $ref: '#/components/schemas/JsonEnum'
        value:
          oneOf:
          - description: Any type
          - type: 'null'
      required:
      - id
      - type
      - value
      title: CodeExecutionNodeJsonResult
    SearchResult:
      type: object
      properties:
        text:
          type: string
          description: The text of the chunk that matched the search query.
        score:
          type: number
          format: double
          description: A score representing how well the chunk matches the search query.
        keywords:
          type: array
          items:
            type: string
        document:
          $ref: '#/components/schemas/SearchResultDocument'
          description: The document that contains the chunk that matched the search query.
        meta:
          oneOf:
          - $ref: '#/components/schemas/SearchResultMeta'
          - type: 'null'
          description: Additional information about the search result.
      required:
      - text
      - score
      - keywords
      - document
      title: SearchResult
    VellumImageRequest:
      type: object
      properties:
        src:
          type: string
          description: "The reference to the source data. This can be one of the following formats:\n1. A base64-encoded data URL (e.g., 'data:application/pdf;base64,JVBERi0xLjQKJcfs...').\n2. A url pointing to a file accessible over HTTP or HTTPS.\n3. A reference to a file that's been previously uploaded to Vellum, in the form of 'vellum:uploaded-file:{uploaded_file_id}'.\n    You can use the Uploaded Files API to retrieve the url of the uploaded file given its ID. See https://docs.vellum.ai/developers/client-sdk/uploaded-files/retrieve for details."
        metadata:
          type:
          - object
          - 'null'
          additionalProperties:
            description: Any type
      required:
      - src
      title: VellumImageRequest
    TerminalNodeErrorResult:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
          format: uuid
        name:
          type: string
          description: The unique name given to the terminal node that produced this output.
        type:
          $ref: '#/components/schemas/ErrorEnum'
        value:
          oneOf:
          - $ref: '#/components/schemas/VellumError'
          - type: 'null'
      required:
      - name
      - type
      - value
      title: TerminalNodeErrorResult
    PromptNodeResultData:
      type: object
      properties:
        execution_meta:
          oneOf:
          - $ref: '#/components/schemas/PromptNodeExecutionMeta'
          - type: 'null'
        output_id:
          type: string
        array_output_id:
          type:
          - string
          - 'null'
        execution_id:
          type:
          - string
          - 'null'
        text:
          type:
          - string
          - 'null'
        delta:
          type:
          - string
          - 'null'
      required:
      - output_id
      title: PromptNodeResultData
    WorkflowOutputVideo:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          description: The output's name, as defined in the workflow
        type:
          $ref: '#/components/schemas/VideoEnum'
        value:
          oneOf:
          - $ref: '#/components/schemas/VellumVideo'
          - type: 'null'
      required:
      - id
      - name
      - type
      - value
      description: A video output from a Workflow execution.
      title: WorkflowOutputVideo
    DocumentVellumValue:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/DocumentEnum'
        value:
          oneOf:
          - $ref: '#/components/schemas/VellumDocument'
          - type: 'null'
      required:
      - type
      - value
      description: A base Vellum primitive value representing a document.
      title: DocumentVellumValue
    ExecuteWorkflowStreamErrorResponse:
      type: object
      properties:
        detail:
          type: string
          description: Details about why the request failed.
      required:
      - detail
      title: ExecuteWorkflowStreamErrorResponse
    WorkflowEnum:
      type: string
      enum:
      - WORKFLOW
      title: WorkflowEnum
    ExecutionJsonVellumValue:
      type: object
      properties:
        id:
          type: string
          description: The variable's uniquely identifying internal id.
        name:
          type: string
        type:
          $ref: '#/components/schemas/JsonEnum'
        value:
          oneOf:
          - description: Any type
          - type: 'null'
      required:
      - id
      - name
      - type
      - value
      description: A value representing a JSON object.
      title: ExecutionJsonVellumValue
    NodeInputCompiledDocumentValue:
      type: object
      properties:
        node_input_id:
          type: string
        key:
          type: string
        type:
          $ref: '#/components/schemas/DocumentEnum'
        value:
          oneOf:
          - $ref: '#/components/schemas/VellumDocument'
          - type: 'null'
      required:
      - node_input_id
      - key
      - type
      - value
      title: NodeInputCompiledDocumentValue
    NodeOutputCompiledArrayValue:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/ArrayEnum'
        value:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/VellumValue'
        node_output_id:
          type: string
        state:
          $ref: '#/components/schemas/WorkflowNodeResultEventState'
      required:
      - type
      - value
      - node_output_id
      description: An output returned by a node that is of type ARRAY.
      title: NodeOutputCompiledArrayValue
    WorkflowRequestJSONInputRequest:
      type: object
      properties:
        name:
          type: string
          description: The variable's name, as defined in the Workflow.
        type:
          $ref: '#/components/schemas/JsonEnum'
        value:
          oneOf:
          - description: Any type
          - type: 'null'
      required:
      - name
      - type
      - value
      description: The input for a JSON variable in a Workflow.
      title: WorkflowRequestJSONInputRequest
    VellumSecret:
      type: object
      properties:
        name:
          type: string
      required:
      - name
      title: VellumSecret
    WorkflowOutputChatHistory:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          description: The output's name, as defined in the workflow
        type:
          $ref: '#/components/schemas/ChatHistoryEnum'
        value:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ChatMessage'
      required:
      - id
      - name
      - type
      - value
      description: A chat history output from a Workflow execution.
      title: WorkflowOutputChatHistory
    SubworkflowNodeResultData:
      type: object
      properties:
        execution_id:
          type:
          - string
          - 'null'
          format: uuid
      title: SubworkflowNodeResultData
    SecretEnum:
      type: string
      enum:
      - SECRET
      title: SecretEnum
    ConditionalEnum:
      type: string
      enum:
      - CONDITIONAL
      title: ConditionalEnum
    IterationStateEnum:
      type: string
      enum:
      - INITIATED
      - FULFILLED
      - REJECTED
      description: '* `INITIATED` - INITIATED

        * `FULFILLED` - FULFILLED

        * `REJECTED` - REJECTED'
      title: IterationStateEnum
    ExecutionErrorVellumValue:
      type: object
      properties:
        id:
          type: string
          description: The variable's uniquely identifying internal id.
        name:
          type: string
        type:
          $ref: '#/components/schemas/ErrorEnum'
        value:
          oneOf:
          - $ref: '#/components/schemas/VellumError'
          - type: 'null'
      required:
      - id
      - name
      - type
      - value
      description: A value representing an Error.
      title: ExecutionErrorVellumValue
    WorkflowResultEventOutputDataSearchResults:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
          format: uuid
        name:
          type: string
        state:
          $ref: '#/components/schemas/WorkflowNodeResultEventState'
        node_id:
          type:
          - string
          - 'null'
        delta:
          type:
          - string
          - 'null'
          description: The newly output string value. Only relevant for string outputs with a state of STREAMING.
        type:
          $ref: '#/components/schemas/SearchResultsEnum'
        value:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SearchResult'
      required:
      - name
      - state
      - delta
      - type
      - value
      description: A Search Results output streamed from a Workflow execution.
      title: WorkflowResultEventOutputDataSearchResults
    ArrayEnum:
      type: string
      enum:
      - ARRAY
      title: ArrayEnum
    CodeExecutionNodeResult:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/CodeExecutionEnum'
        data:
          $ref: '#/components/schemas/CodeExecutionNodeResultData'
      required:
      - type
      - data
      description: A Node Result Event emitted from a Code Execution Node.
      title: CodeExecutionNodeResult
    MLModelUsage:
      type: object
      properties:
        output_token_count:
          type:
          - integer
          - 'null'
        input_token_count:
          type:
          - integer
          - 'null'
        input_char_count:
          type:
          - integer
          - 'null'
        output_char_count:
          type:
          - integer
          - 'null'
        compute_nanos:
          type:
          - integer
          - 'null'
        cache_creation_input_tokens:
          type:
          - integer
          - 'null'
        cache_read_input_tokens:
          type:
          - integer
          - 'null'
      title: MLModelUsage
    FunctionCallChatMessageContent:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/FunctionCallEnum'
        value:
          $ref: '#/components/schemas/FunctionCallChatMessageContentValue'
      required:
      - type
      - value
      description: A function call value that is used in a chat message.
      title: FunctionCallChatMessageContent
    WorkflowRequestInputRequest:
      oneOf:
      - $ref: '#/components/schemas/WorkflowRequestStringInputRequest'
      - $ref: '#/components/schemas/WorkflowRequestJSONInputRequest'
      - $ref: '#/components/schemas/WorkflowRequestChatHistoryInputRequest'
      - $ref: '#/components/schemas/WorkflowRequestNumberInputRequest'
      - $ref: '#/components/schemas/WorkflowRequestAudioInputRequest'
      - $ref: '#/components/schemas/WorkflowRequestVideoInputRequest'
      - $ref: '#/components/schemas/WorkflowRequestImageInputRequest'
      - $ref: '#/components/schemas/WorkflowRequestDocumentInputRequest'
      title: WorkflowRequestInputRequest
    ChatMessageRole:
      type: string
      enum:
      - SYSTEM
      - ASSISTANT
      - USER
      - FUNCTION
      description: '* `SYSTEM` - System

        * `ASSISTANT` - Assistant

        * `USER` - User

        * `FUNCTION` - Function'
      title: ChatMessageRole
    AudioVellumValue:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/AudioEnum'
        value:
          oneOf:
          - $ref: '#/components/schemas/VellumAudio'
          - type: 'null'
      required:
      - type
      - value
      description: A base Vellum primitive value representing audio.
      title: AudioVellumValue
    TerminalNodeStringResult:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
          format: uuid
        name:
          type: string
          description: The unique name given to the terminal node that produced this output.
        type:
          $ref: '#/components/schemas/StringEnum'
        value:
          type:
          - string
          - 'null'
      required:
      - name
      - type
      - value
      title: TerminalNodeStringResult
    NumberEnum:
      type: string
      enum:
      - NUMBER
      title: NumberEnum
    SearchResultDocument:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
          format: uuid
          description: The ID of the document.
        label:
          type: string
          description: The human-readable name for the document.
        external_id:
          type:
          - string
          - 'null'
          description: The unique ID of the document as represented in an external system and specified when it was originally uploaded.
        metadata:
          type:
          - object
          - 'null'
          additionalProperties:
            description: Any type
          description: A previously supplied JSON object containing metadata that can be filtered on when searching.
      required:
      - label
      title: SearchResultDocument
    TemplatingNodeStringResult:
      type: object
      properties:
        id:
          type: string
        type:
          $ref: '#/components/schemas/StringEnum'
        value:
          type:
          - string
          - 'null'
      required:
      - id
      - type
      - value
      title: TemplatingNodeStringResult
    WorkflowExecutionWorkflowResultEvent:
      type: object
      properties:
        execution_id:
          type: string
        run_id:
          type:
          - string
          - 'null'
        external_id:
          type:
          - string
          - 'null'
        type:
          $ref: '#/components/schemas/WorkflowEnum'
        data:
          $ref: '#/components/schemas/WorkflowResultEvent'
      required:
      - execution_id
      - type
      - data
      description: A WORKFLOW-level event emitted from the workflow's execution.
      title: WorkflowExecutionWorkflowResultEvent
    ExecutionNumberVellumValue:
      type: object
      properties:
        id:
          type: string
          description: The variable's uniquely identifying internal id.
        name:
          type: string
        type:
          $ref: '#/components/schemas/NumberEnum'
        value:
          type:
          - number
          - 'null'
          format: double
      required:
      - id
      - name
      - type
      - value
      description: A value representing a number.
      title: ExecutionNumberVellumValue
    ConditionalNodeResultData:
      type: object
      properties:
        source_handle_id:
          type:
          - string
          - 'null'
      title: ConditionalNodeResultData
    AudioChatMessageContentRequest:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/AudioEnum'
        value:
          $ref: '#/components/schemas/VellumAudioRequest'
      required:
      - type
      - value
      description: An audio value that is used in a chat message.
      title: AudioChatMessageContentRequest
    WorkflowRequestAudioInputRequest:
      type: object
      properties:
        name:
          type: string
          description: The variable's name, as defined in the Workflow.
        type:
          $ref: '#/components/schemas/AudioEnum'
        value:
          $ref: '#/components/schemas/VellumAudioRequest'
      required:
      - name
      - type
      - value
      description: The input for an audio variable in a Workflow.
      title: WorkflowRequestAudioInputRequest
    NodeOutputCompiledValue:
      oneOf:
      - $ref: '#/components/schemas/NodeOutputCompiledStringValue'
      - $ref: '#/components/schemas/NodeOutputCompiledNumberValue'
      - $ref: '#/components/schemas/NodeOutputCompiledJsonValue'
      - $ref: '#/components/schemas/NodeOutputCompiledChatHistoryValue'
      - $ref: '#/components/schemas/NodeOutputCompiledSearchResultsValue'
      - $ref: '#/components/schemas/NodeOutputCompiledErrorValue'
      - $ref: '#/components/schemas/NodeOutputCompiledArrayValue'
      - $ref: '#/components/schemas/NodeOutputCompiledFunctionCallValue'
      - $ref: '#/components/schemas/NodeOutputCompiledThinkingValue'
      title: NodeOutputCompiledValue
    NodeOutputCompiledThinkingValue:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/ThinkingEnum'
        value:
          oneOf:
          - $ref: '#/components/schemas/StringVellumValue'
          - type: 'null'
        node_output_id:
          type: string
        state:
          $ref: '#/components/schemas/WorkflowNodeResultEventState'
      required:
      - type
      - value
      - node_output_id
      description: An output returned by a node that is of type THINKING.
      title: NodeOutputCompiledThinkingValue
    ExecutionArrayVellumValue:
      type: object
      properties:
        id:
          type: string
          description: The variable's uniquely identifying internal id.
        name:
          type: string
        type:
          $ref: '#/components/schemas/ArrayEnum'
        value:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/VellumValue'
      required:
      - id
      - name
      - type
      - value
      description: A value representing an array of Vellum variable values.
      title: ExecutionArrayVellumValue
    WorkflowNodeResultEventState:
      type: string
      enum:
      - INITIATED
      - STREAMING
      - FULFILLED
      - REJECTED
      description: '* `INITIATED` - INITIATED

        * `STREAMING` - STREAMING

        * `FULFILLED` - FULFILLED

        * `REJECTED` - REJECTED'
      title: WorkflowNodeResultEventState
    SubworkflowNodeResult:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/SubworkflowEnum'
        data:
          $ref: '#/components/schemas/SubworkflowNodeResultData'
      required:
      - type
      description: A Node Result Event emitted from a Subworkflow Node.
      title: SubworkflowNodeResult
    MergeEnum:
      type: string
      enum:
      - MERGE
      title: MergeEnum
    WorkflowOutputArray:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          description: The output's name, as defined in the workflow
        type:
          $ref: '#/components/schemas/ArrayEnum'
        value:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/VellumValue'
      required:
      - id
      - name
      - type
      - value
      description: An array output from a Workflow execution.
      title: WorkflowOutputArray
    ExecutionStringVellumValue:
      type: object
      properties:
        id:
          type: string
          description: The variable's uniquely identifying internal id.
        name:
          type: string
        type:
          $ref: '#/components/schemas/StringEnum'
        value:
          type:
          - string
          - 'null'
      required:
      - id
      - name
      - type
      - value
      description: A value representing a string.
      title: ExecutionStringVellumValue
    WorkflowResultEventOutputDataChatHistory:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
          format: uuid
        name:
          type: string
        state:
          $ref: '#/components/schemas/WorkflowNodeResultEventState'
        node_id:
          type:
          - string
          - 'null'
        delta:
          type:
          - string
          - 'null'
          description: The newly output string value. Only relevant for string outputs with a state of STREAMING.
        type:
          $ref: '#/components/schemas/ChatHistoryEnum'
        value:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ChatMessage'
      required:
      - name
      - state
      - delta
      - type
      - value
      description: A Chat History output streamed from a Workflow execution.
      title: WorkflowResultEventOutputDataChatHistory
    ApiNodeResultData:
      type: object
      properties:
        json:
          type:
          - object
          - 'null'
          additionalProperties:
            description: Any type
        text_output_id:
          type: string
        text:
          type:
          - string
          - 'null'
        json_output_id:
          type: string
        status_code_output_id:
          type: string
        status_code:
          type: integer
      required:
      - text_output_id
      - json_output_id
      - status_code_output_id
      - status_code
      title: ApiNodeResultData
    SearchResultMetaSource:
      oneOf:
      - $ref: '#/components/schemas/PdfSearchResultMetaSource'
      title: SearchResultMetaSource
    NodeInputCompiledImageValue:
      type: object
      properties:
        node_input_id:
          type: string
        key:
          type: string
        type:
          $ref: '#/components/schemas/ImageEnum'
        value:
          oneOf:
          - $ref: '#/components/schemas/VellumImage'
          - type: 'null'
      required:
      - node_input_id
      - key
      - type
      - value
      title: NodeInputCompiledImageValue
    ExecutionFunctionCallVellumValue:
      type: object
      properties:
        id:
          type: string
          description: The variable's uniquely identifying internal id.
        name:
          type: string
        type:
          $ref: '#/components/schemas/FunctionCallEnum'
        value:
          oneOf:
          - $ref: '#/components/schemas/FunctionCall'
          - type: 'null'
      required:
      - id
      - name
      - type
      - value
      description: A value representing a Function Call.
      title: ExecutionFunctionCallVellumValue
    SearchResultMeta:
      type: object
      properties:
        source:
          oneOf:
          - $ref: '#/components/schemas/SearchResultMetaSource'
          - type: 'null'
      title: SearchResultMeta
    WorkflowExecutionEventErrorCode:
      type: string
      enum:
      - WORKFLOW_INITIALIZATION
      - WORKFLOW_CANCELLED
      - WORKFLOW_TIMEOUT
      - PROVIDER_CREDENTIALS_UNAVAILABLE
      - INTEGRATION_CREDENTIALS_UNAVAILABLE
      - NODE_EXECUTION_COUNT_LIMIT_REACHED
      - INTERNAL_SERVER_ERROR
      - NODE_EXECUTION
      - NODE_CANCELLED
      - NODE_TIMEOUT
      - LLM_PROVIDER
      - INVALID_TEMPLATE
      - INVALID_INPUTS
      - PROVIDER_QUOTA_EXCEEDED
      - USER_DEFINED_ERROR
      description: '* `WORKFLOW_INITIALIZATION` - WORKFLOW_INITIALIZATION

        * `WORKFLOW_CANCELLED` - WORKFLOW_CANCELLED

        * `WORKFLOW_TIMEOUT` - WORKFLOW_TIMEOUT

        * `PROVIDER_CREDENTIALS_UNAVAILABLE` - PROVIDER_CREDENTIALS_UNAVAILABLE

        * `INTEGRATION_CREDENTIALS_UNAVAILABLE` - INTEGRATION_CREDENTIALS_UNAVAILABLE

        * `NODE_EXECUTION_COUNT_LIMIT_REACHED` - NODE_EXECUTION_COUNT_LIMIT_REACHED

        * `INTERNAL_SERVER_ERROR` - INTERNAL_SERVER_ERROR

        * `NODE_EXECUTION` - NODE_EXECUTION

        * `NODE_CANCELLED` - NODE_CANCELLED

        * `NODE_TIMEOUT` - NODE_TIMEOUT

        * `LLM_PROVIDER` - LLM_PROVIDER

        * `INVALID_TEMPLATE` - INVALID_TEMPLATE

        * `INVALID_INPUTS` - INVALID_INPUTS

        * `PROVIDER_QUOTA_EXCEEDED` - PROVIDER_QUOTA_EXCEEDED

        * `USER_DEFINED_ERROR` - USER_DEFINED_ERROR'
      title: WorkflowExecutionEventErrorCode
    MetricNodeResult:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/MetricEnum'
      required:
      - type
      description: A Node Result Event emitted from a Metric Node.
      title: MetricNodeResult
    ConditionalNodeResult:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/ConditionalEnum'
        data:
          $ref: '#/components/schemas/ConditionalNodeResultData'
      required:
      - type
      - data
      description: A Node Result Event emitted from a Conditional Node.
      title: ConditionalNodeResult
    WorkflowResultEvent:
      type: object
      properties:
        id:
          type: string
        state:
          $ref: '#/components/schemas/WorkflowResultEventState'
        ts:
          type: string
          format: date-time
        output:
          oneOf:
          - $ref: '#/components/schemas/WorkflowResultEventOutputData'
          - type: 'null'
        error:
          oneOf:
          - $ref: '#/components/schemas/WorkflowEventError'
          - type: 'null'
