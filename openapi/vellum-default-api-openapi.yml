    LogicalOperator:
      type: string
      enum:
      - '='
      - '!='
      - <
      - '>'
      - <=
      - '>='
      - contains
      - beginsWith
      - endsWith
      - doesNotContain
      - doesNotBeginWith
      - doesNotEndWith
      - 'null'
      - notNull
      - in
      - notIn
      - between
      - notBetween
      - concat
      - +
      - '-'
      - blank
      - notBlank
      - coalesce
      - accessField
      - parseJson
      - and
      - or
      - isError
      - length
      description: '* `=` - EQUALS

        * `!=` - DOES_NOT_EQUAL

        * `<` - LESS_THAN

        * `>` - GREATER_THAN

        * `<=` - LESS_THAN_OR_EQUAL_TO

        * `>=` - GREATER_THAN_OR_EQUAL_TO

        * `contains` - CONTAINS

        * `beginsWith` - BEGINS_WITH

        * `endsWith` - ENDS_WITH

        * `doesNotContain` - DOES_NOT_CONTAIN

        * `doesNotBeginWith` - DOES_NOT_BEGIN_WITH

        * `doesNotEndWith` - DOES_NOT_END_WITH

        * `null` - NULL

        * `notNull` - NOT_NULL

        * `in` - IN

        * `notIn` - NOT_IN

        * `between` - BETWEEN

        * `notBetween` - NOT_BETWEEN

        * `concat` - CONCAT

        * `+` - ADD

        * `-` - MINUS

        * `blank` - BLANK

        * `notBlank` - NOT_BLANK

        * `coalesce` - COALESCE

        * `accessField` - ACCESS_FIELD

        * `parseJson` - PARSE_JSON

        * `and` - AND

        * `or` - OR

        * `isError` - IS_ERROR

        * `length` - LENGTH'
      title: LogicalOperator
