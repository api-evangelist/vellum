openapi: 3.2.0
info:
  title: Client SDK Subpackage Test Suite Runs API
  version: 1.0.0
servers:
- url: https://predict.vellum.ai
- url: https://api.vellum.ai
- url: https://documents.vellum.ai
tags:
- name: subpackage_testSuiteRuns
paths:
  /v1/test-suite-runs:
    post:
      operationId: create
      summary: Create
      description: Trigger a Test Suite and create a new Test Suite Run
      tags:
      - subpackage_testSuiteRuns
      parameters:
      - name: X-API-KEY
        in: header
        required: true
        schema:
          type: string
      - name: X-API-Version
        in: header
        required: false
        schema:
          type: string
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestSuiteRunRead'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestSuiteRunCreateRequest'
  /v1/test-suite-runs/{id}:
    get:
      operationId: retrieve
      summary: Retrieve
      description: Retrieve a specific Test Suite Run by ID
      tags:
      - subpackage_testSuiteRuns
      parameters:
      - name: id
        in: path
        description: A UUID string identifying this test suite run.
        required: true
        schema:
          type: string
          format: uuid
      - name: X-API-KEY
        in: header
        required: true
        schema:
          type: string
      - name: X-API-Version
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestSuiteRunRead'
  /v1/test-suite-runs/{id}/executions:
    get:
      operationId: list-executions
      summary: List Executions
      tags:
      - subpackage_testSuiteRuns
      parameters:
      - name: id
        in: path
        description: A UUID string identifying this test suite run.
        required: true
        schema:
          type: string
          format: uuid
      - name: expand
        in: query
        description: 'The response fields to expand for more information.

          - ''metric_results.metric_label'' expands the metric label for each metric result.

          - ''metric_results.metric_definition'' expands the metric definition for each metric result.

          - ''metric_results.metric_definition.name'' expands the metric definition name for each metric result.'
        required: false
        schema:
          type: array
          items:
            type: string
      - name: limit
        in: query
        description: Number of results to return per page.
        required: false
        schema:
          type: integer
      - name: offset
        in: query
        description: The initial index from which to return the results.
        required: false
        schema:
          type: integer
      - name: X-API-KEY
        in: header
        required: true
        schema:
          type: string
      - name: X-API-Version
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTestSuiteRunExecutionList'
components:
  schemas:
    AudioChatMessageContentRequest:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/AudioEnum'
        value:
          $ref: '#/components/schemas/VellumAudioRequest'
      required:
      - type
      - value
      description: An audio value that is used in a chat message.
      title: AudioChatMessageContentRequest
    AudioEnum:
      type: string
      enum:
      - AUDIO
      title: AudioEnum
    TestSuiteRunRead:
      type: object
      properties:
        id:
          type: string
          format: uuid
        created:
          type: string
          format: date-time
        test_suite:
          $ref: '#/components/schemas/TestSuiteRunTestSuite'
        state:
          $ref: '#/components/schemas/TestSuiteRunState'
          description: 'The current state of this run


            * `QUEUED` - Queued

            * `RUNNING` - Running

            * `COMPLETE` - Complete

            * `FAILED` - Failed

            * `CANCELLED` - Cancelled'
        exec_config:
          oneOf:
          - $ref: '#/components/schemas/TestSuiteRunExecConfig'
          - type: 'null'
          description: Configuration that defines how the Test Suite should be run
        progress:
          $ref: '#/components/schemas/TestSuiteRunProgress'
      required:
      - id
      - created
      - test_suite
      - state
      title: TestSuiteRunRead
    NamedTestCaseErrorVariableValue:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/ErrorEnum'
        value:
          oneOf:
          - $ref: '#/components/schemas/VellumError'
          - type: 'null'
        name:
          type: string
      required:
      - type
      - value
      - name
      description: Named Test Case value that is of type ERROR
      title: NamedTestCaseErrorVariableValue
    SearchResultsEnum:
      type: string
      enum:
      - SEARCH_RESULTS
      title: SearchResultsEnum
    TestSuiteRunCreateRequest:
      type: object
      properties:
        test_suite_id:
          type: string
          format: uuid
          description: The ID of the Test Suite to run. Must provide either this or test_suite_id.
        test_suite_name:
          type: string
          description: The name of the Test Suite to run. Must provide either this or test_suite_id.
        exec_config:
          $ref: '#/components/schemas/TestSuiteRunExecConfigRequest'
          description: Configuration that defines how the Test Suite should be run
      required:
      - exec_config
      title: TestSuiteRunCreateRequest
    NamedTestCaseStringVariableValue:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/StringEnum'
        value:
          type:
          - string
          - 'null'
        name:
          type: string
      required:
      - type
      - value
      - name
      description: Named Test Case value that is of type STRING
      title: NamedTestCaseStringVariableValue
    TestSuiteRunWorkflowSandboxHistoryItemExecConfigTypeEnum:
      type: string
      enum:
      - WORKFLOW_SANDBOX_HISTORY_ITEM
      description: '* `WORKFLOW_SANDBOX_HISTORY_ITEM` - WORKFLOW_SANDBOX_HISTORY_ITEM'
      title: TestSuiteRunWorkflowSandboxHistoryItemExecConfigTypeEnum
    TestSuiteRunDeploymentReleaseTagExecConfigDataRequest:
      type: object
      properties:
        deployment_id:
          type: string
          format: uuid
          description: The ID of the Prompt Deployment to run the Test Suite against.
        tag:
          type: string
          default: LATEST
          description: A tag identifying which release of the Prompt Deployment to run the Test Suite against. Useful for testing past versions of the Prompt Deployment
      required:
      - deployment_id
      title: TestSuiteRunDeploymentReleaseTagExecConfigDataRequest
    VellumValue:
      oneOf:
      - $ref: '#/components/schemas/StringVellumValue'
      - $ref: '#/components/schemas/NumberVellumValue'
      - $ref: '#/components/schemas/JsonVellumValue'
      - $ref: '#/components/schemas/AudioVellumValue'
      - $ref: '#/components/schemas/VideoVellumValue'
      - $ref: '#/components/schemas/ImageVellumValue'
      - $ref: '#/components/schemas/DocumentVellumValue'
      - $ref: '#/components/schemas/FunctionCallVellumValue'
      - $ref: '#/components/schemas/ErrorVellumValue'
      - $ref: '#/components/schemas/ArrayVellumValue'
      - $ref: '#/components/schemas/ChatHistoryVellumValue'
      - $ref: '#/components/schemas/SearchResultsVellumValue'
      - $ref: '#/components/schemas/ThinkingVellumValue'
      title: VellumValue
    NamedTestCaseSearchResultsVariableValue:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/SearchResultsEnum'
        value:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SearchResult'
        name:
          type: string
      required:
      - type
      - value
      - name
      description: Named Test Case value that is of type SEARCH_RESULTS
      title: NamedTestCaseSearchResultsVariableValue
    FunctionCallChatMessageContentValueRequest:
      type: object
      properties:
        name:
          type: string
        arguments:
          type: object
          additionalProperties:
            description: Any type
        id:
          type:
          - string
          - 'null'
      required:
      - name
      - arguments
      description: The final resolved function call value.
      title: FunctionCallChatMessageContentValueRequest
    TestSuiteRunExternalExecConfigRequest:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/TestSuiteRunExternalExecConfigDataRequest'
        test_case_ids:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Optionally specify a subset of test case ids to run. If not provided, all test cases within the test suite will be run by default.
        type:
          $ref: '#/components/schemas/TestSuiteRunExternalExecConfigTypeEnum'
      required:
      - data
      description: Execution configuration for running a Vellum Test Suite against an external callable
      title: TestSuiteRunExternalExecConfigRequest
    AudioVellumValueRequest:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/AudioEnum'
        value:
          oneOf:
          - $ref: '#/components/schemas/VellumAudioRequest'
          - type: 'null'
      required:
      - type
      - value
      description: A base Vellum primitive value representing audio.
      title: AudioVellumValueRequest
    ExternalTestCaseExecution:
      type: object
      properties:
        outputs:
          type: array
          items:
            $ref: '#/components/schemas/NamedTestCaseVariableValue'
          description: The output values of a callable that was executed against a Test Case outside of Vellum
        test_case_id:
          type: string
      required:
      - outputs
      - test_case_id
      title: ExternalTestCaseExecution
    ArrayEnum:
      type: string
      enum:
      - ARRAY
      title: ArrayEnum
    NamedTestCaseNumberVariableValueRequest:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/NumberEnum'
        value:
          type:
          - number
          - 'null'
          format: double
        name:
          type: string
      required:
      - type
      - value
      - name
      description: Named Test Case value that is of type NUMBER
      title: NamedTestCaseNumberVariableValueRequest
    NamedTestCaseFunctionCallVariableValueRequest:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/FunctionCallEnum'
        value:
          oneOf:
          - $ref: '#/components/schemas/FunctionCallRequest'
          - type: 'null'
        name:
          type: string
      required:
      - type
      - value
      - name
      description: Named Test Case value that is of type FUNCTION_CALL
      title: NamedTestCaseFunctionCallVariableValueRequest
    ChatMessageRole:
      type: string
      enum:
      - SYSTEM
      - ASSISTANT
      - USER
      - FUNCTION
      description: '* `SYSTEM` - System

        * `ASSISTANT` - Assistant

        * `USER` - User

        * `FUNCTION` - Function'
      title: ChatMessageRole
    NamedTestCaseNumberVariableValue:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/NumberEnum'
        value:
          type:
          - number
          - 'null'
          format: double
        name:
          type: string
      required:
      - type
      - value
      - name
      description: Named Test Case value that is of type NUMBER
      title: NamedTestCaseNumberVariableValue
    ChatMessageRequest:
      type: object
      properties:
        text:
          type:
          - string
          - 'null'
        role:
          $ref: '#/components/schemas/ChatMessageRole'
        content:
          oneOf:
          - $ref: '#/components/schemas/ChatMessageContentRequest'
          - type: 'null'
        source:
          type:
          - string
          - 'null'
          description: An optional identifier representing who or what generated this message.
        metadata:
          type:
          - object
          - 'null'
          additionalProperties:
            description: Any type
      required:
      - role
      title: ChatMessageRequest
    NamedTestCaseStringVariableValueRequest:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/StringEnum'
        value:
          type:
          - string
          - 'null'
        name:
          type: string
      required:
      - type
      - value
      - name
      description: Named Test Case value that is of type STRING
      title: NamedTestCaseStringVariableValueRequest
    StringChatMessageContent:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/StringEnum'
        value:
          type: string
      required:
      - type
      - value
      description: A string value that is used in a chat message.
      title: StringChatMessageContent
    SearchResultMetaSource:
      oneOf:
      - $ref: '#/components/schemas/PdfSearchResultMetaSource'
      title: SearchResultMetaSource
    NamedTestCaseAudioVariableValueRequest:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/AudioEnum'
        value:
          oneOf:
          - $ref: '#/components/schemas/VellumAudioRequest'
          - type: 'null'
        name:
          type: string
      required:
      - type
      - value
      - name
      description: Named Test Case value that is of type AUDIO
      title: NamedTestCaseAudioVariableValueRequest
    ThinkingVellumValue:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/ThinkingEnum'
        value:
          oneOf:
          - $ref: '#/components/schemas/StringVellumValue'
          - type: 'null'
      required:
      - type
      - value
      description: A value representing Thinking mode output.
      title: ThinkingVellumValue
    ExternalTestCaseExecutionRequest:
      type: object
      properties:
        outputs:
          type: array
          items:
            $ref: '#/components/schemas/NamedTestCaseVariableValueRequest'
          description: The output values of a callable that was executed against a Test Case outside of Vellum
        test_case_id:
          type: string
      required:
      - outputs
      - test_case_id
      title: ExternalTestCaseExecutionRequest
    TestSuiteRunExecutionFunctionCallOutput:
      type: object
      properties:
        name:
          type: string
        type:
          $ref: '#/components/schemas/FunctionCallEnum'
        value:
          oneOf:
          - $ref: '#/components/schemas/FunctionCall'
          - type: 'null'
        output_variable_id:
          type: string
          format: uuid
      required:
      - name
      - type
      - value
      - output_variable_id
      description: Execution output of an entity evaluated during a Test Suite Run that is of type FUNCTION_CALL
      title: TestSuiteRunExecutionFunctionCallOutput
    PdfSearchResultMetaSourceRequest:
      type: object
      properties:
        document_type:
          $ref: '#/components/schemas/PdfEnum'
        start_page_num:
          type:
          - integer
          - 'null'
          description: The 1-indexed page number where the chunk starts in the document. Only available for supported chunking strategies and document types.
        end_page_num:
          type:
          - integer
          - 'null'
          description: The 1-indexed page number where the chunk ends in the document. Only available for supported chunking strategies and document types.
      required:
      - document_type
      - start_page_num
      - end_page_num
      description: The source of a search result from a PDF document.
      title: PdfSearchResultMetaSourceRequest
    TestSuiteRunExecutionMetricDefinition:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        name:
          type: string
      title: TestSuiteRunExecutionMetricDefinition
    NamedTestCaseAudioVariableValue:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/AudioEnum'
        value:
          oneOf:
          - $ref: '#/components/schemas/VellumAudio'
          - type: 'null'
        name:
          type: string
      required:
      - type
      - value
      - name
      description: Named Test Case value that is of type AUDIO
      title: NamedTestCaseAudioVariableValue
    ChatHistoryVellumValue:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/ChatHistoryEnum'
        value:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ChatMessage'
      required:
      - type
      - value
      description: A value representing Chat History.
      title: ChatHistoryVellumValue
    ImageVellumValueRequest:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/ImageEnum'
        value:
          oneOf:
          - $ref: '#/components/schemas/VellumImageRequest'
          - type: 'null'
      required:
      - type
      - value
      description: A base Vellum primitive value representing an image.
      title: ImageVellumValueRequest
    ErrorVellumValueRequest:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/ErrorEnum'
        value:
          oneOf:
          - $ref: '#/components/schemas/VellumErrorRequest'
          - type: 'null'
      required:
      - type
      - value
      description: A value representing an Error.
      title: ErrorVellumValueRequest
    VideoEnum:
      type: string
      enum:
      - VIDEO
      title: VideoEnum
    TestSuiteRunExecutionMetricResult:
      type: object
      properties:
        metric_id:
          type: string
          format: uuid
        outputs:
          type: array
          items:
            $ref: '#/components/schemas/TestSuiteRunMetricOutput'
        metric_label:
          type: string
        metric_definition:
          $ref: '#/components/schemas/TestSuiteRunExecutionMetricDefinition'
      required:
      - metric_id
      - outputs
      title: TestSuiteRunExecutionMetricResult
    SearchResultMeta:
      type: object
      properties:
        source:
          oneOf:
          - $ref: '#/components/schemas/SearchResultMetaSource'
          - type: 'null'
      title: SearchResultMeta
    TestSuiteRunExecutionArrayOutput:
      type: object
      properties:
        name:
          type: string
        type:
          $ref: '#/components/schemas/ArrayEnum'
        value:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/VellumValue'
        output_variable_id:
          type: string
          format: uuid
      required:
      - name
      - type
      - value
      - output_variable_id
      description: Execution output of an entity evaluated during a Test Suite Run that is of type ARRAY
      title: TestSuiteRunExecutionArrayOutput
    ErrorVellumValue:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/ErrorEnum'
        value:
          oneOf:
          - $ref: '#/components/schemas/VellumError'
          - type: 'null'
      required:
      - type
      - value
      description: A value representing an Error.
      title: ErrorVellumValue
    NamedTestCaseDocumentVariableValue:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/DocumentEnum'
        value:
          oneOf:
          - $ref: '#/components/schemas/VellumDocument'
          - type: 'null'
        name:
          type: string
      required:
      - type
      - value
      - name
      title: NamedTestCaseDocumentVariableValue
    TestSuiteRunTestSuite:
      type: object
      properties:
        id:
          type: string
          format: uuid
        history_item_id:
          type: string
          format: uuid
        label:
          type: string
      required:
      - id
      - history_item_id
      - label
      title: TestSuiteRunTestSuite
    TestSuiteRunExternalExecConfig:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/TestSuiteRunExternalExecConfigData'
        test_case_ids:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Optionally specify a subset of test case ids to run. If not provided, all test cases within the test suite will be run by default.
        type:
          $ref: '#/components/schemas/TestSuiteRunExternalExecConfigTypeEnum'
      required:
      - data
      description: Execution configuration for running a Vellum Test Suite against an external callable
      title: TestSuiteRunExternalExecConfig
    ChatMessage:
      type: object
      properties:
        text:
          type:
          - string
          - 'null'
        role:
          $ref: '#/components/schemas/ChatMessageRole'
        content:
          oneOf:
          - $ref: '#/components/schemas/ChatMessageContent'
          - type: 'null'
        source:
          type:
          - string
          - 'null'
          description: An optional identifier representing who or what generated this message.
        metadata:
          type:
          - object
          - 'null'
          additionalProperties:
            description: Any type
      required:
      - role
      title: ChatMessage
    VellumVideoRequest:
      type: object
      properties:
        src:
          type: string
          description: "The reference to the source data. This can be one of the following formats:\n1. A base64-encoded data URL (e.g., 'data:application/pdf;base64,JVBERi0xLjQKJcfs...').\n2. A url pointing to a file accessible over HTTP or HTTPS.\n3. A reference to a file that's been previously uploaded to Vellum, in the form of 'vellum:uploaded-file:{uploaded_file_id}'.\n    You can use the Uploaded Files API to retrieve the url of the uploaded file given its ID. See https://docs.vellum.ai/developers/client-sdk/uploaded-files/retrieve for details."
        metadata:
          type:
          - object
          - 'null'
          additionalProperties:
            description: Any type
      required:
      - src
      title: VellumVideoRequest
    FunctionCallChatMessageContentRequest:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/FunctionCallEnum'
        value:
          $ref: '#/components/schemas/FunctionCallChatMessageContentValueRequest'
      required:
      - type
      - value
      description: A function call value that is used in a chat message.
      title: FunctionCallChatMessageContentRequest
    TestSuiteRunMetricStringOutput:
      type: object
      properties:
        value:
          type:
          - string
          - 'null'
        type:
          $ref: '#/components/schemas/TestSuiteRunMetricStringOutputTypeEnum'
        name:
          type: string
      required:
      - value
      - name
      description: Output for a test suite run metric that is of type STRING
      title: TestSuiteRunMetricStringOutput
    VideoChatMessageContentRequest:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/VideoEnum'
        value:
          $ref: '#/components/schemas/VellumVideoRequest'
      required:
      - type
      - value
      description: A video value that is used in a chat message.
      title: VideoChatMessageContentRequest
    NumberVellumValue:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/NumberEnum'
        value:
          type:
          - number
          - 'null'
          format: double
      required:
      - type
      - value
      description: A value representing a number.
      title: NumberVellumValue
    SearchResultsVellumValue:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/SearchResultsEnum'
        value:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SearchResult'
      required:
      - type
      - value
      description: A value representing Search Results.
      title: SearchResultsVellumValue
    NamedTestCaseChatHistoryVariableValueRequest:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/ChatHistoryEnum'
        value:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ChatMessageRequest'
        name:
          type: string
      required:
      - type
      - value
      - name
      description: Named Test Case value that is of type CHAT_HISTORY
      title: NamedTestCaseChatHistoryVariableValueRequest
    TestSuiteRunMetricErrorOutput:
      type: object
      properties:
        value:
          $ref: '#/components/schemas/VellumError'
        type:
          $ref: '#/components/schemas/TestSuiteRunMetricErrorOutputTypeEnum'
        name:
          type: string
      required:
      - value
      - name
      description: Output for a test suite run metric that is of type ERROR
      title: TestSuiteRunMetricErrorOutput
    NamedTestCaseJsonVariableValue:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/JsonEnum'
        value:
          oneOf:
          - description: Any type
          - type: 'null'
        name:
          type: string
      required:
      - type
      - value
      - name
      description: Named Test Case value that is of type JSON
      title: NamedTestCaseJsonVariableValue
    AudioChatMessageContent:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/AudioEnum'
        value:
          $ref: '#/components/schemas/VellumAudio'
      required:
      - type
      - value
      description: An audio value that is used in a chat message.
      title: AudioChatMessageContent
    NamedTestCaseVideoVariableValue:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/VideoEnum'
        value:
          oneOf:
          - $ref: '#/components/schemas/VellumVideo'
          - type: 'null'
        name:
          type: string
      required:
      - type
      - value
      - name
      title: NamedTestCaseVideoVariableValue
    ArrayChatMessageContentItem:
      oneOf:
      - $ref: '#/components/schemas/StringChatMessageContent'
      - $ref: '#/components/schemas/FunctionCallChatMessageContent'
      - $ref: '#/components/schemas/AudioChatMessageContent'
      - $ref: '#/components/schemas/VideoChatMessageContent'
      - $ref: '#/components/schemas/ImageChatMessageContent'
      - $ref: '#/components/schemas/DocumentChatMessageContent'
      title: ArrayChatMessageContentItem
    DocumentEnum:
      type: string
      enum:
      - DOCUMENT
      title: DocumentEnum
    SearchResultMetaSourceRequest:
