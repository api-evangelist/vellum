- aid: vellum:llm-platform
  name: Vellum LLM Platform API
  description: >-
    The Vellum REST API exposes prompts, workflows, evaluations, datasets, document indexes, deployments,
    and execution endpoints so developers can run versioned LLM pipelines from their own backends and
    capture logs and metrics for production monitoring.
  humanURL: https://docs.vellum.ai
